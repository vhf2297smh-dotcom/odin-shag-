<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#060608">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Один шаг">
<meta name="format-detection" content="telephone=no">
<title>Один шаг</title>
<link rel="manifest" id="manifest" href="data:application/manifest+json,%7B%7D">
<link rel="apple-touch-icon" id="touchicon" href="data:,">
<link rel="icon" id="favicon" href="data:,">
<style>
:root{--bg:#060608;--fg:#f5f2f7;--mut:rgba(245,242,247,.58);--dim:rgba(245,242,247,.34);--faint:rgba(245,242,247,.12);--line:rgba(255,255,255,.08);--y:#f3e15b;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,Inter,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{overflow:hidden;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit;-webkit-user-select:text;user-select:text}
#aura{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none;transition:opacity 1.2s ease}
#aura i{position:absolute;border-radius:50%;filter:blur(70px);transition:background-color 1.6s ease,opacity 1.6s ease}
#aura .b1{width:150vw;height:150vw;max-width:640px;max-height:640px;left:-55%;top:-30%;opacity:.85;animation:d1 19s ease-in-out infinite alternate}
#aura .b2{width:120vw;height:120vw;max-width:560px;max-height:560px;right:-55%;top:-6%;opacity:.75;animation:d2 23s ease-in-out infinite alternate}
#aura .b3{width:90vw;height:90vw;max-width:420px;max-height:420px;left:5%;top:24%;opacity:.55;animation:d3 17s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(18%,10%) scale(1.08)}}
@keyframes d2{to{transform:translate(-16%,14%) scale(.92)}}
@keyframes d3{to{transform:translate(12%,-12%) scale(1.15)}}
#shade{position:fixed;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(6,6,8,0) 0%,rgba(6,6,8,.25) 35%,rgba(6,6,8,.82) 68%,#060608 92%)}
#grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.09;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#view{position:fixed;inset:0;z-index:2;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:calc(var(--sat) + 14px) 18px calc(var(--sab) + 118px)}
#view.noTabs{padding-bottom:calc(var(--sab) + 30px)}
.screen{max-width:460px;margin:0 auto;animation:fadeUp .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.top{display:flex;align-items:center;justify-content:space-between;height:46px;margin-bottom:10px}
.top .date{font-size:14px;color:var(--mut);letter-spacing:.01em}
.top h1{font-size:22px;font-weight:500;letter-spacing:-.01em}
.iconbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.iconbtn svg{width:19px;height:19px}
.wk{display:flex;justify-content:space-between;margin:2px 0 22px}
.wd{width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.2);display:grid;place-items:center;font-size:12.5px;color:var(--mut);position:relative;transition:.3s}
.wd.past{color:var(--fg)}
.wd.on{background:#fff;color:#08080a;border-color:#fff;font-weight:600}
.wd.done::after{content:"";position:absolute;bottom:-9px;width:4px;height:4px;border-radius:50%;background:var(--y)}
.eyebrow{font-size:13px;color:var(--mut);letter-spacing:.02em;margin-bottom:6px}
.hello{font-size:30px;font-weight:300;letter-spacing:-.02em;line-height:1.1;margin-bottom:18px}
.hello b{font-weight:500}
.card{position:relative;border-radius:30px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.08);-webkit-backdrop-filter:blur(26px) saturate(140%);backdrop-filter:blur(26px) saturate(140%);padding:20px;overflow:hidden}
.card+.card,.card+.grid,.grid+.card,.grid+.grid{margin-top:12px}
.card h3{font-size:14px;font-weight:500;color:var(--fg);letter-spacing:.01em}
.card .sub{font-size:13px;color:var(--mut);margin-top:4px;line-height:1.4}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g-pink{background:radial-gradient(95% 95% at 78% 40%,#ff2b8a 0%,#f0609f 30%,#e6a0cc 70%,#ecc4e0 100%);border-color:rgba(255,255,255,.18)}
.g-sage{background:radial-gradient(120% 110% at 50% 70%,#15181b 0%,#2e3d36 45%,#86a393 100%);border-color:rgba(255,255,255,.14)}
.g-blue{background:radial-gradient(120% 120% at 35% 105%,#3150ff 0%,#1a2386 40%,#0b0d26 100%);border-color:rgba(255,255,255,.12)}
.g-orange{background:radial-gradient(55% 60% at 80% 72%,#3b4dff 0%,rgba(59,77,255,0) 100%),linear-gradient(150deg,#ff6a3d 0%,#e8452b 60%,#b8321f 100%);border-color:rgba(255,255,255,.16)}
.g-lav{background:radial-gradient(110% 110% at 30% 0%,#ead0f2 0%,#bb95d9 45%,#6a56a6 100%);border-color:rgba(255,255,255,.2)}
.g-amber{background:radial-gradient(90% 90% at 25% 20%,#ffd76e 0%,#f09a3e 45%,#8c3b1c 100%);border-color:rgba(255,255,255,.18)}
.g-dark{background:radial-gradient(120% 100% at 50% 0%,rgba(255,255,255,.08),rgba(255,255,255,.02));}
.onc{color:#fff;text-shadow:0 1px 14px rgba(0,0,0,.18)}
.onc .sub,.onc .lbl{color:rgba(255,255,255,.82)}
.pill{display:inline-flex;align-items:center;gap:14px;padding:7px 7px 7px 22px;border-radius:999px;background:rgba(16,16,20,.5);border:1px solid rgba(255,255,255,.14);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:#fff;font-size:15px;font-weight:500;letter-spacing:.01em;transition:transform .2s,background .3s}
.pill:active{transform:scale(.96)}
.pill .pc{width:38px;height:38px;border-radius:50%;background:#fff;color:#0a0a0c;display:grid;place-items:center;flex:none}
.pill .pc svg{width:18px;height:18px}
.pill.light{background:rgba(255,255,255,.92);color:#0a0a0c}
.pill.light .pc{background:#0a0a0c;color:#fff}
.pill[disabled]{opacity:.4}
.ghost{padding:12px 16px;border-radius:999px;font-size:14px;color:rgba(255,255,255,.86);border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);transition:.2s}
.ghost:active{transform:scale(.96)}
.ghost[disabled]{opacity:.38}
.center{text-align:center}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.lbl{font-size:12.5px;color:var(--mut);letter-spacing:.02em}
.dm{display:block;overflow:visible}
.dm circle{transition:opacity .3s}
/* check-in */
.ci{border-radius:40px;padding:22px 18px 22px;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.12)}
.ci .q{font-size:19px;text-align:center;font-weight:400;line-height:1.25;color:#fff}
.ci .qs{font-size:13px;text-align:center;color:rgba(255,255,255,.7);margin-top:4px}
.dialwrap{position:relative;width:min(300px,78vw);aspect-ratio:1;margin:8px auto 2px;touch-action:none;cursor:pointer}
.dialwrap svg.dial{width:100%;height:100%;display:block;overflow:visible}
.dialc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.dialc .w{margin-top:14px;font-size:14px;color:rgba(255,255,255,.85);letter-spacing:.02em;min-height:18px}
.lv{display:flex;justify-content:center;gap:10px;margin-top:6px}
.lv button{width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.25);font-size:13px;color:rgba(255,255,255,.8);transition:.25s}
.lv button.on{background:#fff;color:#000;border-color:#fff}
.pager{display:flex;justify-content:center;gap:6px;margin:16px 0 14px}
.pager i{width:5px;height:5px;border-radius:5px;background:rgba(255,255,255,.3);transition:.35s}
.pager i.on{width:18px;background:#fff}
.cifoot{display:flex;align-items:center;justify-content:space-between}
.back{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12)}
.back svg{width:18px;height:18px}
.note{width:100%;border:0;outline:0;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.14);border-radius:22px;padding:16px 18px;font-size:16px;color:#fff;margin:18px 0 6px}
.note::placeholder{color:rgba(255,255,255,.45)}
/* step */
.step{border-radius:38px;padding:22px 22px 20px;min-height:340px;display:flex;flex-direction:column}
.step .blob{position:absolute;width:220px;height:220px;border-radius:50%;filter:blur(40px);right:-60px;top:-50px;background:rgba(255,255,255,.35);animation:d3 12s ease-in-out infinite alternate;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 12px 7px 9px;border-radius:999px;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.18);font-size:13px;color:#fff;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.chip svg{width:15px;height:15px}
.diff{display:flex;gap:4px;align-items:center}
.diff{gap:3px;align-items:flex-end}.diff .dl{font-size:12px;color:rgba(255,255,255,.85);margin-right:5px;align-self:center}.diff i{width:4px;border-radius:2px;background:rgba(255,255,255,.3)}
.diff i.on{background:#fff}
.step .k{font-size:13px;color:rgba(255,255,255,.75);margin-top:26px;letter-spacing:.04em;text-transform:uppercase}
.step h2{font-size:28px;font-weight:400;line-height:1.16;letter-spacing:-.015em;margin-top:8px;color:#fff;text-wrap:balance}
.step .why{font-size:14.5px;line-height:1.45;color:rgba(255,255,255,.84);margin-top:12px;max-width:30em}
.step .acts{margin-top:auto;padding-top:24px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.swapin{animation:swapin .55s cubic-bezier(.2,.8,.2,1)}
@keyframes swapin{from{opacity:0;transform:translateY(10px) scale(.98);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.mini{border-radius:24px;padding:14px 12px 12px;min-height:112px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid rgba(255,255,255,.14);text-align:left}
.mini .lbl{color:rgba(255,255,255,.85)}
.mini .w{font-size:12px;color:rgba(255,255,255,.85)}
.prog{display:grid;grid-template-columns:repeat(10,1fr);gap:9px 0;justify-items:center;margin:16px 0 4px}
.prog i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.1);position:relative}
.prog i.done{background:var(--y);box-shadow:0 0 12px rgba(243,225,91,.45)}
.prog i.miss{background:transparent;border:1px solid rgba(255,255,255,.28)}
.prog i.today{background:#fff;animation:pulse 2s ease-in-out infinite}
.prog i.today.done{background:var(--y)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.4)}50%{box-shadow:0 0 0 6px rgba(255,255,255,0)}}
.banner{border-radius:26px;padding:16px 18px;margin-bottom:14px}
.banner b{font-weight:500;font-size:16px;display:block;color:#fff}
.done-ring{width:120px;height:120px;margin:6px auto 4px;position:relative}
.done-ring svg{width:100%;height:100%}
.done-ring .ck{stroke-dasharray:60;stroke-dashoffset:60;animation:draw .7s .25s cubic-bezier(.6,0,.2,1) forwards}
.done-ring .rg{stroke-dasharray:340;stroke-dashoffset:340;animation:draw 1.1s cubic-bezier(.6,0,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.stats{display:flex;justify-content:center;gap:34px;margin-top:18px}
.stats>div{display:flex;flex-direction:column;align-items:center;gap:10px;white-space:nowrap}
/* bloom */
#bloom{position:fixed;inset:0;z-index:40;pointer-events:none;overflow:hidden}
#bloom .c{position:absolute;width:40px;height:40px;border-radius:50%;transform:translate(-50%,-50%) scale(0);opacity:.7;filter:blur(6px);mix-blend-mode:screen}
#bloom .c.go{animation:bloom 1.15s cubic-bezier(.15,.75,.2,1) forwards}
#bloom .r{position:absolute;width:40px;height:40px;border-radius:50%;border:2px solid rgba(255,255,255,.9);transform:translate(-50%,-50%) scale(0)}
#bloom .r.go{animation:ring 1s cubic-bezier(.15,.75,.2,1) forwards}
#bloom .p{position:absolute;width:7px;height:7px;border-radius:50%;background:#fff;transform:translate(-50%,-50%)}
@keyframes bloom{0%{transform:translate(-50%,-50%) scale(0);opacity:.95}60%{opacity:.75}100%{transform:translate(-50%,-50%) scale(26);opacity:0}}
@keyframes ring{0%{transform:translate(-50%,-50%) scale(0);opacity:1}100%{transform:translate(-50%,-50%) scale(14);opacity:0}}
/* tabs */
#tabs{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(var(--sab) + 14px);display:flex;gap:4px;padding:6px;border-radius:999px;background:rgba(22,22,26,.62);border:1px solid rgba(255,255,255,.1);-webkit-backdrop-filter:blur(26px) saturate(160%);backdrop-filter:blur(26px) saturate(160%);box-shadow:0 18px 50px rgba(0,0,0,.45);transition:opacity .4s,transform .4s}
#tabs.hide{opacity:0;pointer-events:none;transform:translate(-50%,30px)}
#tabs button{display:flex;align-items:center;gap:7px;height:46px;padding:0 15px;border-radius:999px;color:var(--mut);font-size:13.5px;transition:background .35s,color .35s}
#tabs button svg{width:20px;height:20px;flex:none}
#tabs button span{display:none}
#tabs button.on{background:#fff;color:#0a0a0c}
#tabs button.on span{display:inline}
/* sheet */
#sheet{position:fixed;inset:0;z-index:50;display:none}
#sheet.open{display:block}
#sheet .bd{position:absolute;inset:0;background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);opacity:0;transition:opacity .35s}
#sheet.show .bd{opacity:1}
#sheet .pn{position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;border-radius:34px 34px 0 0;background:#111114;border:1px solid rgba(255,255,255,.08);padding:12px 22px calc(var(--sab) + 26px);transform:translateY(105%);transition:transform .45s cubic-bezier(.2,.85,.2,1);max-height:88vh;overflow-y:auto}
#sheet.show .pn{transform:none}
#sheet .grab{width:38px;height:5px;border-radius:5px;background:rgba(255,255,255,.2);margin:0 auto 18px}
#sheet h2{font-size:24px;font-weight:400;letter-spacing:-.01em;line-height:1.2}
#sheet p{font-size:15px;line-height:1.5;color:var(--mut);margin-top:10px}
.link{display:flex;align-items:center;justify-content:space-between;gap:12px;border-radius:24px;padding:18px 18px;margin-top:10px;text-decoration:none;color:#fff;border:1px solid rgba(255,255,255,.14)}
.link b{font-weight:500;font-size:16px;display:block}
.link small{font-size:13px;color:rgba(255,255,255,.78)}
.link .go{width:36px;height:36px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;flex:none}
.link .go svg{width:16px;height:16px}
/* progress */
.hero{text-align:center;padding:8px 0 14px}
.hero .lbl{font-size:15px;color:var(--fg);margin-bottom:14px}
.hero .unit{font-size:13px;color:var(--mut);margin-top:12px}
.wave{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;margin-top:10px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mut)}
.legend i{width:8px;height:8px;border-radius:50%}
.met{border-radius:26px;padding:15px 15px 14px;min-height:126px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid rgba(255,255,255,.14)}
.met .v{display:flex;align-items:flex-end;gap:6px;font-size:28px;font-weight:400;letter-spacing:-.02em;color:#fff}
.met .v small{font-size:12px;color:rgba(255,255,255,.8);margin-bottom:5px}
.bar{height:6px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px}
.cats .r{display:grid;grid-template-columns:78px 1fr 26px;gap:10px;align-items:center;margin-top:12px;font-size:13.5px}
.cats .r em{font-style:normal;text-align:right;color:var(--mut);font-variant-numeric:tabular-nums}
.ins{display:flex;align-items:center;gap:12px;margin-top:12px;font-size:14px;line-height:1.35}
.ins .dot{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center}
.ins .dot svg{width:16px;height:16px;color:#fff}
.ins em{font-style:normal;margin-left:auto;font-variant-numeric:tabular-nums;font-size:13px;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.08)}
.dots5{display:flex;gap:7px}
.dots5 i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.35)}
.dots5 i.on{background:#fff}
/* diary */
.entry{display:grid;grid-template-columns:54px 1fr;gap:14px;padding:16px 16px 16px 14px}
.entry .d{display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:2px}
.entry .d small{font-size:11.5px;color:var(--mut)}
.entry .lv3{display:flex;gap:4px;align-items:flex-end;height:26px}
.entry .lv3 i{width:5px;border-radius:3px}
.entry .t{font-size:15px;line-height:1.38}
.entry .t.muted{color:var(--mut)}
.entry .meta{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12px;color:var(--mut)}
.entry .meta .ok{color:var(--y)}
.entry .n{font-size:13.5px;color:var(--mut);margin-top:8px;line-height:1.4;font-style:italic}
.empty{padding:40px 20px;text-align:center;color:var(--mut);font-size:15px;line-height:1.5}
/* settings */
.set .r{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 2px;border-top:1px solid var(--line);font-size:15px;width:100%;text-align:left}
.set .r:first-of-type{border-top:0}
.set .r small{display:block;font-size:12.5px;color:var(--mut);margin-top:3px;line-height:1.35}
.set .r .chev{color:var(--dim);flex:none}
.set .r.danger{color:#ff8a7a}
.tg{width:56px;height:32px;border-radius:999px;background:rgba(255,255,255,.14);position:relative;flex:none;transition:.3s;border:1px solid rgba(255,255,255,.12)}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.3s cubic-bezier(.3,.9,.3,1)}
.tg.on{background:#7fae96}
.tg.on::after{left:27px}
.time{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:7px 10px;font-size:15px;color:#fff;outline:0;color-scheme:dark}
#toast{position:fixed;left:50%;bottom:calc(var(--sab) + 84px);transform:translate(-50%,20px);z-index:60;padding:11px 18px;border-radius:999px;background:rgba(30,30,34,.9);border:1px solid rgba(255,255,255,.1);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);font-size:14px;opacity:0;transition:.4s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
/* onboarding */
.ob{min-height:calc(100vh - var(--sat) - 60px);display:flex;flex-direction:column}
.ob .brand{font-size:15px;color:rgba(255,255,255,.85);letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.ob .ring{width:min(300px,76vw);aspect-ratio:1;margin:34px auto 26px;position:relative}
.ob .ring svg{width:100%;height:100%;animation:spin 60s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ob .ring .core{position:absolute;inset:31%;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,#e8e6ee 60%,#cfcbd8);box-shadow:0 0 0 14px rgba(255,255,255,.06),0 0 80px rgba(255,255,255,.25);display:grid;place-items:center}
.ob .ring .core i{width:12px;height:12px;border-radius:50%;background:#0a0a0c;box-shadow:0 0 0 5px rgba(0,0,0,.08)}
.ob h1{font-size:44px;font-weight:300;letter-spacing:-.035em;line-height:1}

function dm(str,o={}){
 const d=o.d||6,g=o.g!=null?o.g:3,on=o.on||'#fff',off=o.off||0,step=d+g;
 let x=0,out='';
 const chars=[...String(str)];
 chars.forEach((ch,ci)=>{
  const f=FONT[ch]||FONT[' '];const w=f[0].length;
  for(let r=0;r<7;r++)for(let c=0;c<w;c++){
   const cx=x+c*step+d/2,cy=r*step+d/2;
   if(f[r][c]==='1')out+=`<circle cx="${cx}" cy="${cy}" r="${d/2}" fill="${on}"/>`;
   else if(off)out+=`<circle cx="${cx}" cy="${cy}" r="${d/2}" fill="${on}" opacity="${off}"/>`;
  }
  x+=w*step-g+(ci<chars.length-1?step:0);
 });
 const h=7*step-g;
 return `<svg class="dm" width="${x}" height="${h}" viewBox="0 0 ${x} ${h}" aria-label="${esc(str)}">${out}</svg>`;
}

 const recent=new Set();const t=todayKey();
 for(let i=1;i<=10;i++){const r=dayRec(addDays(t,-i));if(r){if(r.step)recent.add(r.step);if(r.bonus)recent.add(r.bonus)}}
 const y=dayRec(addDays(t,-1));const yCat=y&&y.step&&STEP_BY[y.step]?STEP_BY[y.step].cat:null;
 const exCats=opts.avoidCat?[opts.avoidCat]:[];
 let pool=STEPS.filter(x=>!exclude.includes(x.id)&&!recent.has(x.id));
 if(pool.length<6)pool=STEPS.filter(x=>!exclude.includes(x.id));
 const ws=pool.map(x=>{
  let w=x.d===target?6:x.d===target-1?2.2:x.d===target+1?(target===1?.25:.7):0;
  if(x.cat===yCat)w*=.45;
  if(exCats.includes(x.cat))w*=.15;
  if(c&&c.mood<=2&&(x.cat==='body'||x.cat==='people'))w*=1.5;
  if(c&&c.energy<=2&&x.cat==='body'&&x.d>1)w*=.3;
  if(c&&c.sleep<=2&&x.cat==='mind'&&x.d===1)w*=1.3;
  return w});
 const sum=ws.reduce((a,b)=>a+b,0);
 if(sum<=0)return pool[Math.floor(Math.random()*pool.length)].id;
 let r=Math.random()*sum;for(let i=0;i<pool.length;i++){r-=ws[i];if(r<=0)return pool[i].id}
 return pool[pool.length-1].id;
}

const PAL={low:['#1a2a78','#2a5d6c','#3f3585'],mid:['#3e6b5b','#7a5cb4','#23389a'],high:['#ff3a7c','#ff7a3a','#b35ae0'],calm:['#2b2f5e','#30424a','#4a3a6e']};
function hx(h){return[1,3,5].map(i=>parseInt(h.slice(i,i+2),16))}
function mix(a,b,t){const A=hx(a),B=hx(b);return'#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')}
function setAura(t,dimmed){
 let cols;
 if(t==null)cols=PAL.calm;
 else if(t<.5)cols=PAL.low.map((c,i)=>mix(c,PAL.mid[i],t*2));
 else cols=PAL.mid.map((c,i)=>mix(c,PAL.high[i],(t-.5)*2));

 $('#aura').style.opacity=dimmed?'.45':'1';
}

function dialInner(m,v){

function lastNDays(n){const t=todayKey();return Array.from({length:n},(_,i)=>addDays(t,i-n+1))}
function smoothPath(pts){
 if(pts.length<2)return pts.length?`M${pts[0][0]} ${pts[0][1]}`:'';
 let d=`M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
 for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
  const c1x=p1[0]+(p2[0]-p0[0])/6,c1y=p1[1]+(p2[1]-p0[1])/6,c2x=p2[0]-(p3[0]-p1[0])/6,c2y=p2[1]-(p3[1]-p1[1])/6;
  d+=` C${c1x.toFixed(1)} ${c1y.toFixed(1)} ${c2x.toFixed(1)} ${c2y.toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`}
 return d;
}
function waveChart(days){
 const W=340,H=150,px=8,py=16;const n=days.length;
 const X=i=>px+i*(W-2*px)/(n-1),Y=v=>H-py-(v-1)*(H-2*py)/4;
 let g='';for(let v=1;v<=5;v++)g+=`<line x1="${px}" x2="${W-px}" y1="${Y(v)}" y2="${Y(v)}" stroke="rgba(255,255,255,.06)" stroke-dasharray="1 5" stroke-linecap="round"/>`;
 let lines='',marker='';
 METRICS.forEach((m,mi)=>{
  const pts=[];days.forEach((k,i)=>{const r=dayRec(k);if(hasCI(r))pts.push([X(i),Y(r[m.k])])});
  if(!pts.length)return;
  lines+=`<path d="${smoothPath(pts)}" fill="none" stroke="${m.c}" stroke-width="${m.k==='mood'?2.6:1.6}" stroke-linecap="round" opacity="${m.k==='mood'?1:.75}"/>`;
  if(m.k==='mood'){const p=pts[pts.length-1];marker=`<circle cx="${p[0]}" cy="${p[1]}" r="9" fill="${m.c}" opacity=".25"/><circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#fff"/><path d="M${p[0]-6} ${p[1]-16}h12l-6 8z" fill="#f3e15b"/>`}
 });
 let xl='';days.forEach((k,i)=>{if(i%((n>14)?7:3)===0||i===n-1){const d=parseKey(k);xl+=`<text x="${X(i)}" y="${H+12}" fill="rgba(255,255,255,.35)" font-size="9.5" text-anchor="middle">${d.getDate()}</text>`}});
 return `<svg class="wave" viewBox="0 0 ${W} ${H+16}">${g}${lines}${marker}${xl}</svg>`;
}

function trendOf(k){const d=lastNDays(14);const a=avgOf(k,d.slice(0,7)),b=avgOf(k,d.slice(7));if(a==null||b==null)return'';const df=b-a;return df>.25?'растёт':df<-.25?'проседает':'ровно'}
function insights(){
 const ks=Object.keys(S.days).sort();const pairs=[];
 ks.forEach(k=>{const r=S.days[k];if(r.done&&STEP_BY[r.step]){const nx=S.days[addDays(k,1)];if(hasCI(nx))pairs.push({cat:STEP_BY[r.step].cat,m:nx.mood})}});
 if(pairs.length<5)return{need:5-pairs.length};
 const base=pairs.reduce((a,p)=>a+p.m,0)/pairs.length;
 const res=CAT_ORDER.map(c=>{const ps=pairs.filter(p=>p.cat===c);return{c,n:ps.length,d:ps.length?ps.reduce((a,p)=>a+p.m,0)/ps.length-base:0}}).filter(x=>x.n>=2).sort((a,b)=>b.d-a.d);
 return{res,base};
}

function bloom(x,y,color){
 const b=$('#bloom');b.innerHTML='';
 const c=document.createElement('div');c.className='c';c.style.cssText=`left:${x}px;top:${y}px;background:radial-gradient(circle,${color},rgba(255,255,255,.0) 70%)`;b.appendChild(c);
 const r=document.createElement('div');r.className='r';r.style.cssText=`left:${x}px;top:${y}px`;b.appendChild(r);
 for(let i=0;i<14;i++){const p=document.createElement('div');p.className='p';const a=i/14*Math.PI*2,dist=90+Math.random()*80;p.style.cssText=`left:${x}px;top:${y}px;background:${i%3?'#fff':'#f3e15b'}`;b.appendChild(p);
  p.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:1},{transform:`translate(calc(-50% + ${Math.cos(a)*dist}px),calc(-50% + ${Math.sin(a)*dist}px)) scale(.2)`,opacity:0}],{duration:900+Math.random()*300,easing:'cubic-bezier(.15,.75,.2,1)',fill:'forwards'})}
 requestAnimationFrame(()=>{c.classList.add('go');r.classList.add('go')});
 setTimeout(()=>b.innerHTML='',1400);
}

function demoDays(){
 let seed=11;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
 const t=todayKey();const days={};
 const notes={14:'Тяжело встал, но вышел',12:'Плохо спал, много мыслей',10:'Позвонил брату, полегчало',7:'Первая пробежка за месяц',4:'Приготовил нормальный ужин',2:'Написал старому другу'};
 const plan=['body','people','work','mind','body','food','people','body','work','people','mind','body','food','people'];
 const used=[];
 for(let i=14;i>=1;i--){const k=addDays(t,-i);if(i===9||i===5)continue;
  const base=1.7+(14-i)/13*2.1;const prev=days[addDays(k,-1)];
  const lift=prev&&prev.done&&STEP_BY[prev.step]&&['body','people'].includes(STEP_BY[prev.step].cat)?.55:-.15;
  const mood=clamp(Math.round(base+lift+(rnd()-.5)*.6),1,5);
  const r={sleep:clamp(Math.round(base-.2+(rnd()-.5)*1.4),1,5),energy:clamp(Math.round(base+(rnd()-.5)*1.1),1,5),mood,note:notes[i]||''};
  const sc=scoreOf(r);const target=sc<2.4?1:sc<3.6?2:3;const cat=plan[14-i];
  let opts=STEPS.filter(x=>x.cat===cat&&x.d===target&&!used.includes(x.id));if(!opts.length)opts=STEPS.filter(x=>x.cat===cat&&!used.includes(x.id));
  const st=opts[Math.floor(rnd()*opts.length)];used.push(st.id);
  Object.assign(r,{step:st.id,shown:[st.id],swaps:0,done:i!==12,bonusDone:false});
  if(i===3||i===7){const b=STEPS.find(x=>x.cat==='mind'&&x.d===1&&!used.includes(x.id));if(b){used.push(b.id);r.bonus=b.id;r.bonusDone=true}}
  days[k]=r}
 return days;
}

/* ---------- reminder ---------- */
let remT=null;
function scheduleReminder(){
 clearTimeout(remT);if(!S.settings.remind)return;
 const [h,m]=(S.settings.time||'09:00').split(':').map(Number);const now=new Date();const at=new Date();at.setHours(h,m,0,0);if(at<=now)at.setDate(at.getDate()+1);
 remT=setTimeout(()=>{const r=dayRec(todayKey());if(!hasCI(r)){try{if('Notification' in window&&Notification.permission==='granted')new Notification('Один шаг',{body:'Три касания — и шаг на сегодня.'});else toast('Время для одного шага')}catch(_){toast('Время для одного шага')}}scheduleReminder()},Math.min(at-now,2147483000));
}

/* ---------- PWA bits ---------- */
function setupPWA(){
 try{
  const cv=document.createElement('canvas');cv.width=cv.height=180;const x=cv.getContext('2d');
  const g=x.createRadialGradient(60,50,10,90,90,130);g.addColorStop(0,'#ff3d8b');g.addColorStop(.45,'#7a5cb4');g.addColorStop(1,'#0b0d26');x.fillStyle=g;x.fillRect(0,0,180,180);
  x.fillStyle='#fff';const f=FONT['1'];for(let r=0;r<7;r++)for(let c=0;c<5;c++)if(f[r][c]==='1'){x.beginPath();x.arc(54+c*18+7,27+r*18+7,7,0,7);x.fill()}
  const png=cv.toDataURL('image/png');
  $('#touchicon').href=png;$('#favicon').href=png;
  const man={name:'Один шаг',short_name:'Один шаг',display:'standalone',background_color:'#060608',theme_color:'#060608',start_url:'.',lang:'ru',icons:[{src:png,sizes:'180x180',type:'image/png'}]};
  $('#manifest').href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify(man));
 }catch(_){}
}

/* ---------- boot ---------- */
let lastDay=todayKey();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&todayKey()!==lastDay){lastDay=todayKey();ui.ci=null;ui.editing=false;render()}});
setupPWA();render();scheduleReminder();

</script>
