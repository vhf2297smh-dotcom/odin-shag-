<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#060608">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Опора">
<meta name="format-detection" content="telephone=no">
<title>Опора</title>
<link rel="manifest" id="manifest" href="data:application/manifest+json,%7B%7D">
<link rel="apple-touch-icon" id="touchicon" href="data:,">
<link rel="icon" id="favicon" href="data:,">
<style>
:root{--bg:#060608;--fg:#f5f2f7;--mut:rgba(245,242,247,.58);--dim:rgba(245,242,247,.34);--faint:rgba(245,242,247,.12);--line:rgba(255,255,255,.08);--y:#f3e15b;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,Inter,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{overflow:hidden;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit;-webkit-user-select:text;user-select:text}
#aura{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none;transition:opacity 1.2s ease}
#aura i{position:absolute;border-radius:50%;filter:blur(70px);transition:background-color 1.6s ease,opacity 1.6s ease}
#aura .b1{width:150vw;height:150vw;max-width:640px;max-height:640px;left:-55%;top:-30%;opacity:.85;animation:d1 19s ease-in-out infinite alternate}
#aura .b2{width:120vw;height:120vw;max-width:560px;max-height:560px;right:-55%;top:-6%;opacity:.75;animation:d2 23s ease-in-out infinite alternate}
#aura .b3{width:90vw;height:90vw;max-width:420px;max-height:420px;left:5%;top:24%;opacity:.55;animation:d3 17s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(18%,10%) scale(1.08)}}
@keyframes d2{to{transform:translate(-16%,14%) scale(.92)}}
@keyframes d3{to{transform:translate(12%,-12%) scale(1.15)}}
#shade{position:fixed;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(6,6,8,0) 0%,rgba(6,6,8,.25) 35%,rgba(6,6,8,.82) 68%,#060608 92%)}
#grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.09;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#view{position:fixed;inset:0;z-index:2;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:calc(var(--sat) + 14px) 18px calc(var(--sab) + 118px)}
#view.noTabs{padding-bottom:calc(var(--sab) + 30px)}
.screen{max-width:460px;margin:0 auto;animation:fadeUp .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.top{display:flex;align-items:center;justify-content:space-between;height:46px;margin-bottom:10px}
.top .date{font-size:14px;color:var(--mut);letter-spacing:.01em}
.top h1{font-size:22px;font-weight:500;letter-spacing:-.01em}
.iconbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.iconbtn svg{width:19px;height:19px}
.wk{display:flex;justify-content:space-between;margin:2px 0 22px}
.wd{width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.2);display:grid;place-items:center;font-size:12.5px;color:var(--mut);position:relative;transition:.3s}
.wd.past{color:var(--fg)}
.wd.on{background:#fff;color:#08080a;border-color:#fff;font-weight:600}
.wd.done::after{content:"";position:absolute;bottom:-9px;width:4px;height:4px;border-radius:50%;background:var(--y)}
.eyebrow{font-size:13px;color:var(--mut);letter-spacing:.02em;margin-bottom:6px}
.hello{font-size:30px;font-weight:300;letter-spacing:-.02em;line-height:1.1;margin-bottom:18px}
.hello b{font-weight:500}
.card{position:relative;border-radius:30px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.08);-webkit-backdrop-filter:blur(26px) saturate(140%);backdrop-filter:blur(26px) saturate(140%);padding:20px;overflow:hidden}
.card+.card,.card+.grid,.grid+.card,.grid+.grid{margin-top:12px}
.card h3{font-size:14px;font-weight:500;color:var(--fg);letter-spacing:.01em}
.card .sub{font-size:13px;color:var(--mut);margin-top:4px;line-height:1.4}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g-pink{background:radial-gradient(95% 95% at 78% 40%,#ff2b8a 0%,#f0609f 30%,#e6a0cc 70%,#ecc4e0 100%);border-color:rgba(255,255,255,.18)}
.g-sage{background:radial-gradient(120% 110% at 50% 70%,#15181b 0%,#2e3d36 45%,#86a393 100%);border-color:rgba(255,255,255,.14)}
.g-blue{background:radial-gradient(120% 120% at 35% 105%,#3150ff 0%,#1a2386 40%,#0b0d26 100%);border-color:rgba(255,255,255,.12)}
.g-orange{background:radial-gradient(55% 60% at 80% 72%,#3b4dff 0%,rgba(59,77,255,0) 100%),linear-gradient(150deg,#ff6a3d 0%,#e8452b 60%,#b8321f 100%);border-color:rgba(255,255,255,.16)}
.g-lav{background:radial-gradient(110% 110% at 30% 0%,#ead0f2 0%,#bb95d9 45%,#6a56a6 100%);border-color:rgba(255,255,255,.2)}
.g-amber{background:radial-gradient(90% 90% at 25% 20%,#ffd76e 0%,#f09a3e 45%,#8c3b1c 100%);border-color:rgba(255,255,255,.18)}
.g-dark{background:radial-gradient(120% 100% at 50% 0%,rgba(255,255,255,.08),rgba(255,255,255,.02));}
.onc{color:#fff;text-shadow:0 1px 14px rgba(0,0,0,.18)}
.onc .sub,.onc .lbl{color:rgba(255,255,255,.82)}
.pill{display:inline-flex;align-items:center;gap:14px;padding:7px 7px 7px 22px;border-radius:999px;background:rgba(16,16,20,.5);border:1px solid rgba(255,255,255,.14);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:#fff;font-size:15px;font-weight:500;letter-spacing:.01em;transition:transform .2s,background .3s}
.pill:active{transform:scale(.96)}
.pill .pc{width:38px;height:38px;border-radius:50%;background:#fff;color:#0a0a0c;display:grid;place-items:center;flex:none}
.pill .pc svg{width:18px;height:18px}
.pill.light{background:rgba(255,255,255,.92);color:#0a0a0c}
.pill.light .pc{background:#0a0a0c;color:#fff}
.pill[disabled]{opacity:.4}
.ghost{padding:12px 16px;border-radius:999px;font-size:14px;color:rgba(255,255,255,.86);border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);transition:.2s}
.ghost:active{transform:scale(.96)}
.ghost[disabled]{opacity:.38}
.center{text-align:center}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.lbl{font-size:12.5px;color:var(--mut);letter-spacing:.02em}
.dm{display:block;overflow:visible}
.dm circle{transition:opacity .3s}
/* check-in */
.ci{border-radius:40px;padding:22px 18px 22px;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.12)}
.ci .q{font-size:19px;text-align:center;font-weight:400;line-height:1.25;color:#fff}
.ci .qs{font-size:13px;text-align:center;color:rgba(255,255,255,.7);margin-top:4px}
.dialwrap{position:relative;width:min(300px,78vw);aspect-ratio:1;margin:8px auto 2px;touch-action:none;cursor:pointer}
.dialwrap svg.dial{width:100%;height:100%;display:block;overflow:visible}
.dialc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.dialc .w{margin-top:14px;font-size:14px;color:rgba(255,255,255,.85);letter-spacing:.02em;min-height:18px}
.lv{display:flex;justify-content:center;gap:10px;margin-top:6px}
.lv button{width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.25);font-size:13px;color:rgba(255,255,255,.8);transition:.25s}
.lv button.on{background:#fff;color:#000;border-color:#fff}
.pager{display:flex;justify-content:center;gap:6px;margin:16px 0 14px}
.pager i{width:5px;height:5px;border-radius:5px;background:rgba(255,255,255,.3);transition:.35s}
.pager i.on{width:18px;background:#fff}
.cifoot{display:flex;align-items:center;justify-content:space-between}
.back{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12)}
.back svg{width:18px;height:18px}
.note{width:100%;border:0;outline:0;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.14);border-radius:22px;padding:16px 18px;font-size:16px;color:#fff;margin:18px 0 6px}
.note::placeholder{color:rgba(255,255,255,.45)}
/* step */
.step{border-radius:38px;padding:22px 22px 20px;min-height:340px;display:flex;flex-direction:column}
.step .blob{position:absolute;width:220px;height:220px;border-radius:50%;filter:blur(40px);right:-60px;top:-50px;background:rgba(255,255,255,.35);animation:d3 12s ease-in-out infinite alternate;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 12px 7px 9px;border-radius:999px;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.18);font-size:13px;color:#fff;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.chip svg{width:15px;height:15px}
.diff{display:flex;gap:4px;align-items:center}
.diff{gap:3px;align-items:flex-end}.diff .dl{font-size:12px;color:rgba(255,255,255,.85);margin-right:5px;align-self:center}.diff i{width:4px;border-radius:2px;background:rgba(255,255,255,.3)}
.diff i.on{background:#fff}
.step .k{font-size:13px;color:rgba(255,255,255,.75);margin-top:26px;letter-spacing:.04em;text-transform:uppercase}
.step h2{font-size:28px;font-weight:400;line-height:1.16;letter-spacing:-.015em;margin-top:8px;color:#fff;text-wrap:balance}
.step .why{font-size:14.5px;line-height:1.45;color:rgba(255,255,255,.84);margin-top:12px;max-width:30em}
.step .acts{margin-top:auto;padding-top:24px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.swapin{animation:swapin .55s cubic-bezier(.2,.8,.2,1)}
@keyframes swapin{from{opacity:0;transform:translateY(10px) scale(.98);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.mini{border-radius:24px;padding:14px 12px 12px;min-height:112px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid rgba(255,255,255,.14);text-align:left}
.mini .lbl{color:rgba(255,255,255,.85)}
.mini .w{font-size:12px;color:rgba(255,255,255,.85)}
.prog{display:grid;grid-template-columns:repeat(10,1fr);gap:9px 0;justify-items:center;margin:16px 0 4px}
.prog i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.1);position:relative}
.prog i.done{background:var(--y);box-shadow:0 0 12px rgba(243,225,91,.45)}
.prog i.miss{background:transparent;border:1px solid rgba(255,255,255,.28)}
.prog i.today{background:#fff;animation:pulse 2s ease-in-out infinite}
.prog i.today.done{background:var(--y)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.4)}50%{box-shadow:0 0 0 6px rgba(255,255,255,0)}}
.banner{border-radius:26px;padding:16px 18px;margin-bottom:14px}
.banner b{font-weight:500;font-size:16px;display:block;color:#fff}
.done-ring{width:120px;height:120px;margin:6px auto 4px;position:relative}
.done-ring svg{width:100%;height:100%}
.done-ring .ck{stroke-dasharray:60;stroke-dashoffset:60;animation:draw .7s .25s cubic-bezier(.6,0,.2,1) forwards}
.done-ring .rg{stroke-dasharray:340;stroke-dashoffset:340;animation:draw 1.1s cubic-bezier(.6,0,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.stats{display:flex;justify-content:center;gap:34px;margin-top:18px}
.stats>div{display:flex;flex-direction:column;align-items:center;gap:10px;white-space:nowrap}
/* bloom */
#bloom{position:fixed;inset:0;z-index:40;pointer-events:none;overflow:hidden}
#bloom .c{position:absolute;width:40px;height:40px;border-radius:50%;transform:translate(-50%,-50%) scale(0);opacity:.7;filter:blur(6px);mix-blend-mode:screen}
#bloom .c.go{animation:bloom 1.15s cubic-bezier(.15,.75,.2,1) forwards}
#bloom .r{position:absolute;width:40px;height:40px;border-radius:50%;border:2px solid rgba(255,255,255,.9);transform:translate(-50%,-50%) scale(0)}
#bloom .r.go{animation:ring 1s cubic-bezier(.15,.75,.2,1) forwards}
#bloom .p{position:absolute;width:7px;height:7px;border-radius:50%;background:#fff;transform:translate(-50%,-50%)}
@keyframes bloom{0%{transform:translate(-50%,-50%) scale(0);opacity:.95}60%{opacity:.75}100%{transform:translate(-50%,-50%) scale(26);opacity:0}}
@keyframes ring{0%{transform:translate(-50%,-50%) scale(0);opacity:1}100%{transform:translate(-50%,-50%) scale(14);opacity:0}}
/* tabs */
#tabs{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(var(--sab) + 14px);display:flex;gap:4px;padding:6px;border-radius:999px;background:rgba(22,22,26,.62);border:1px solid rgba(255,255,255,.1);-webkit-backdrop-filter:blur(26px) saturate(160%);backdrop-filter:blur(26px) saturate(160%);box-shadow:0 18px 50px rgba(0,0,0,.45);transition:opacity .4s,transform .4s}
#tabs.hide{opacity:0;pointer-events:none;transform:translate(-50%,30px)}
#tabs button{display:flex;align-items:center;gap:7px;height:46px;padding:0 15px;border-radius:999px;color:var(--mut);font-size:13.5px;transition:background .35s,color .35s}
#tabs button svg{width:20px;height:20px;flex:none}
#tabs button span{display:none}
#tabs button.on{background:#fff;color:#0a0a0c}
#tabs button.on span{display:inline}
/* sheet */
#sheet{position:fixed;inset:0;z-index:50;display:none}
#sheet.open{display:block}
#sheet .bd{position:absolute;inset:0;background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);opacity:0;transition:opacity .35s}
#sheet.show .bd{opacity:1}
#sheet .pn{position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;border-radius:34px 34px 0 0;background:#111114;border:1px solid rgba(255,255,255,.08);padding:12px 22px calc(var(--sab) + 26px);transform:translateY(105%);transition:transform .45s cubic-bezier(.2,.85,.2,1);max-height:88vh;overflow-y:auto}
#sheet.show .pn{transform:none}
#sheet .grab{width:38px;height:5px;border-radius:5px;background:rgba(255,255,255,.2);margin:0 auto 18px}
#sheet h2{font-size:24px;font-weight:400;letter-spacing:-.01em;line-height:1.2}
#sheet p{font-size:15px;line-height:1.5;color:var(--mut);margin-top:10px}
.link{display:flex;align-items:center;justify-content:space-between;gap:12px;border-radius:24px;padding:18px 18px;margin-top:10px;text-decoration:none;color:#fff;border:1px solid rgba(255,255,255,.14)}
.link b{font-weight:500;font-size:16px;display:block}
.link small{font-size:13px;color:rgba(255,255,255,.78)}
.link .go{width:36px;height:36px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;flex:none}
.link .go svg{width:16px;height:16px}
/* progress */
.hero{text-align:center;padding:8px 0 14px}
.hero .lbl{font-size:15px;color:var(--fg);margin-bottom:14px}
.hero .unit{font-size:13px;color:var(--mut);margin-top:12px}
.wave{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;margin-top:10px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mut)}
.legend i{width:8px;height:8px;border-radius:50%}
.met{border-radius:26px;padding:15px 15px 14px;min-height:126px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid rgba(255,255,255,.14)}
.met .v{display:flex;align-items:flex-end;gap:6px;font-size:28px;font-weight:400;letter-spacing:-.02em;color:#fff}
.met .v small{font-size:12px;color:rgba(255,255,255,.8);margin-bottom:5px}
.bar{height:6px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px}
.cats .r{display:grid;grid-template-columns:78px 1fr 26px;gap:10px;align-items:center;margin-top:12px;font-size:13.5px}
.cats .r em{font-style:normal;text-align:right;color:var(--mut);font-variant-numeric:tabular-nums}
.ins{display:flex;align-items:center;gap:12px;margin-top:12px;font-size:14px;line-height:1.35}
.ins .dot{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center}
.ins .dot svg{width:16px;height:16px;color:#fff}
.ins em{font-style:normal;margin-left:auto;font-variant-numeric:tabular-nums;font-size:13px;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.08)}
.dots5{display:flex;gap:7px}
.dots5 i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.35)}
.dots5 i.on{background:#fff}
/* diary */
.entry{display:grid;grid-template-columns:54px 1fr;gap:14px;padding:16px 16px 16px 14px}
.entry .d{display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:2px}
.entry .d small{font-size:11.5px;color:var(--mut)}
.entry .lv3{display:flex;gap:4px;align-items:flex-end;height:26px}
.entry .lv3 i{width:5px;border-radius:3px}
.entry .t{font-size:15px;line-height:1.38}
.entry .t.muted{color:var(--mut)}
.entry .meta{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12px;color:var(--mut)}
.entry .meta .ok{color:var(--y)}
.entry .n{font-size:13.5px;color:var(--mut);margin-top:8px;line-height:1.4;font-style:italic}
.empty{padding:40px 20px;text-align:center;color:var(--mut);font-size:15px;line-height:1.5}
/* settings */
.set .r{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 2px;border-top:1px solid var(--line);font-size:15px;width:100%;text-align:left}
.set .r:first-of-type{border-top:0}
.set .r small{display:block;font-size:12.5px;color:var(--mut);margin-top:3px;line-height:1.35}
.set .r .chev{color:var(--dim);flex:none}
.set .r.danger{color:#ff8a7a}
.tg{width:56px;height:32px;border-radius:999px;background:rgba(255,255,255,.14);position:relative;flex:none;transition:.3s;border:1px solid rgba(255,255,255,.12)}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.3s cubic-bezier(.3,.9,.3,1)}
.tg.on{background:#7fae96}
.tg.on::after{left:27px}
.time{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:7px 10px;font-size:15px;color:#fff;outline:0;color-scheme:dark}
#toast{position:fixed;left:50%;bottom:calc(var(--sab) + 84px);transform:translate(-50%,20px);z-index:60;padding:11px 18px;border-radius:999px;background:rgba(30,30,34,.9);border:1px solid rgba(255,255,255,.1);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);font-size:14px;opacity:0;transition:.4s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
/* onboarding */
.ob{min-height:calc(100vh - var(--sat) - 60px);display:flex;flex-direction:column}
.ob .brand{font-size:15px;color:rgba(255,255,255,.85);letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.ob .ring{width:min(300px,76vw);aspect-ratio:1;margin:34px auto 26px;position:relative}
.ob .ring svg{width:100%;height:100%;animation:spin 60s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ob .ring .core{position:absolute;inset:31%;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,#e8e6ee 60%,#cfcbd8);box-shadow:0 0 0 14px rgba(255,255,255,.06),0 0 80px rgba(255,255,255,.25);display:grid;place-items:center}
.ob .ring .core i{width:12px;height:12px;border-radius:50%;background:#0a0a0c;box-shadow:0 0 0 5px rgba(0,0,0,.08)}
.ob h1{font-size:44px;font-weight:300;letter-spacing:-.035em;line-height:1}

#splash::before{display:none}
#splash{--t:1;overflow:hidden}

#splash .bl{position:absolute;width:150px;height:150px;border-radius:50%;filter:blur(22px);mix-blend-mode:screen;opacity:0}
#splash .b1{background:#ff5aa5;animation:bl1 calc(var(--t)*1.1s) cubic-bezier(.3,.7,.2,1) forwards}
#splash .b2{background:#a65ce0;animation:bl2 calc(var(--t)*1.1s) cubic-bezier(.3,.7,.2,1) forwards}
#splash .b3{background:#ff7a3a;animation:bl3 calc(var(--t)*1.1s) cubic-bezier(.3,.7,.2,1) forwards}
@keyframes bl1{0%{opacity:0;transform:translate(-150px,-210px) scale(.5)}40%{opacity:.9}100%{opacity:.85;transform:translate(-18px,-12px) scale(1.15)}}
@keyframes bl2{0%{opacity:0;transform:translate(170px,-60px) scale(.5)}40%{opacity:.9}100%{opacity:.85;transform:translate(18px,-6px) scale(1.1)}}
@keyframes bl3{0%{opacity:0;transform:translate(-40px,230px) scale(.5)}40%{opacity:.9}100%{opacity:.85;transform:translate(0,16px) scale(1.15)}}
@keyframes hue{to{filter:hue-rotate(28deg)}}
#splash .sporb{position:relative;width:150px;height:150px;border-radius:50%;display:grid;place-items:center;margin-top:-40px;
 background:radial-gradient(circle at 30% 24%,rgba(255,255,255,.55),rgba(255,255,255,0) 30%),radial-gradient(circle at 50% 60%,rgba(255,90,165,.65),rgba(166,92,224,.55) 50%,rgba(255,122,58,.6) 100%);
 box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35),inset -14px -20px 40px rgba(60,10,60,.45),0 30px 90px rgba(166,92,224,.5);
 animation:orbIn calc(var(--t)*.9s) calc(var(--t)*.55s) cubic-bezier(.2,.9,.3,1.25) both,orbPulse 2.4s calc(var(--t)*1.5s) ease-in-out infinite}
@keyframes orbIn{0%{opacity:0;transform:scale(.4);filter:blur(16px)}100%{opacity:1;transform:none;filter:none}}
@keyframes orbPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
#splash .sphl{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent,rgba(255,255,255,.35),transparent 30%);animation:spin calc(var(--t)*3s) linear infinite;-webkit-mask:radial-gradient(circle,transparent 66%,#000 68%);mask:radial-gradient(circle,transparent 66%,#000 68%)}
#splash .splogo{animation:none;position:relative}

#splash .lg-b{animation-delay:calc(var(--t)*.9s)}#splash .lg-b2{animation-delay:calc(var(--t)*1.02s)}#splash .lg-b3{animation-delay:calc(var(--t)*1.14s)}
#splash .lg-dot{animation-delay:calc(var(--t)*1.3s)}
#splash.fast .lg-b,#splash.fast .lg-dot{animation-duration:.35s}
#splash .spname{position:relative;margin-top:30px;font-size:30px;font-weight:300;letter-spacing:.42em;margin-left:.42em;animation:none;display:flex}

@keyframes letter{to{opacity:1;transform:none;filter:none}}
#splash .sptag{animation:spfade calc(var(--t)*.8s) calc(var(--t)*1.55s) both}

["b1","body",1,10,"m","","Выйди на улицу на 10 минут. Просто пройдись.","Свет и движение сбивают оцепенение быстрее, чем любые мысли."],

function dm(str,o={}){
 const d=o.d||6,g=o.g!=null?o.g:3,on=o.on||'#fff',off=o.off||0,step=d+g;
 let x=0,out='';
 const chars=[...String(str)];
 chars.forEach((ch,ci)=>{
  const f=FONT[ch]||FONT[' '];const w=f[0].length;
  for(let r=0;r<7;r++)for(let c=0;c<w;c++){
   const cx=x+c*step+d/2,cy=r*step+d/2;
   if(f[r][c]==='1')out+=`<circle cx="${cx}" cy="${cy}" r="${d/2}" fill="${on}"/>`;
   else if(off)out+=`<circle cx="${cx}" cy="${cy}" r="${d/2}" fill="${on}" opacity="${off}"/>`;
  }
  x+=w*step-g+(ci<chars.length-1?step:0);
 });
 const h=7*step-g;
 return `<svg class="dm" width="${x}" height="${h}" viewBox="0 0 ${x} ${h}" aria-label="${esc(str)}">${out}</svg>`;
}

function dialInner(m,v){
 const c=150,R=132,N=60,cur=135+270*(v-1)/4;let t='';
 for(let i=0;i<=N;i++){const a=135+270*i/N;const rad=a*Math.PI/180;const major=i%15===0;const r1=major?R-18:R-9;const on=a<=cur+.01;
  t+=`<line x1="${(c+r1*Math.cos(rad)).toFixed(1)}" y1="${(c+r1*Math.sin(rad)).toFixed(1)}" x2="${(c+R*Math.cos(rad)).toFixed(1)}" y2="${(c+R*Math.sin(rad)).toFixed(1)}" stroke="${on?'#fff':'rgba(255,255,255,.22)'}" stroke-width="${major?2.6:1.6}" stroke-linecap="round"/>`}
 const kr=R-38,ka=cur*Math.PI/180,kx=c+kr*Math.cos(ka),ky=c+kr*Math.sin(ka);
 // yellow hatch near knob
 let hatch='';for(let i=0;i<5;i++){const a=(cur-14+i*4)*Math.PI/180;hatch+=`<line x1="${(c+(R-30)*Math.cos(a)).toFixed(1)}" y1="${(c+(R-30)*Math.sin(a)).toFixed(1)}" x2="${(c+(R-22)*Math.cos(a+.05)).toFixed(1)}" y2="${(c+(R-22)*Math.sin(a+.05)).toFixed(1)}" stroke="#f3e15b" stroke-width="2" stroke-linecap="round" opacity="${v>1?1:0}"/>`}
 const arcR=R-38;const sA=135*Math.PI/180;const large=(cur-135)>180?1:0;
 const arc=v>1?`<path d="M${(c+arcR*Math.cos(sA)).toFixed(1)} ${(c+arcR*Math.sin(sA)).toFixed(1)} A${arcR} ${arcR} 0 ${large} 1 ${kx.toFixed(1)} ${ky.toFixed(1)}" fill="none" stroke="${m.c}" stroke-width="3" stroke-linecap="round" opacity=".9"/>`:'';
 const svg=`<svg class="dial" viewBox="0 0 300 300"><defs><radialGradient id="kg" cx="40%" cy="35%"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#d9d6e2"/></radialGradient></defs>
 <circle cx="150" cy="150" r="${arcR}" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="3"/>${arc}${t}${hatch}
 <circle cx="${kx.toFixed(1)}" cy="${ky.toFixed(1)}" r="17" fill="url(#kg)" style="filter:drop-shadow(0 0 14px rgba(255,255,255,.5))"/><circle cx="${kx.toFixed(1)}" cy="${ky.toFixed(1)}" r="3.4" fill="#0a0a0c"/></svg>`;
 return svg+`<div class="dialc">${dm(String(v),{d:9,g:4,off:.05})}<div class="w">${m.words[v-1]}</div></div>`;
}

function bindDial(){
 const el=document.getElementById('dial');if(!el)return;
 const set=e=>{const b=el.getBoundingClientRect();const x=e.clientX-b.left-b.width/2,y=e.clientY-b.top-b.height/2;
  if(Math.hypot(x,y)<b.width*.18)return;
  let a=Math.atan2(y,x)*180/Math.PI;a=(a+360)%360;if(a<90)a+=360;a=clamp(a,135,405);
  const v=Math.round((a-135)/270*4)+1;setLevel(v)};
 let down=false;
 el.addEventListener('pointerdown',e=>{down=true;try{el.setPointerCapture(e.pointerId)}catch(_){}set(e)});
 el.addEventListener('pointermove',e=>{if(down)set(e)});
 const up=()=>down=false;el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
}

}

function smoothPath(pts){

 let d=`M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
 for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
  const c1x=p1[0]+(p2[0]-p0[0])/6,c1y=p1[1]+(p2[1]-p0[1])/6,c2x=p2[0]-(p3[0]-p1[0])/6,c2y=p2[1]-(p3[1]-p1[1])/6;
  d+=` C${c1x.toFixed(1)} ${c1y.toFixed(1)} ${c2x.toFixed(1)} ${c2y.toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`}
 return d;
}
function waveChart(days){
 const W=340,H=150,px=8,py=16;const n=days.length;
 const X=i=>px+i*(W-2*px)/(n-1),Y=v=>H-py-(v-1)*(H-2*py)/4;
 let g='';for(let v=1;v<=5;v++)g+=`<line x1="${px}" x2="${W-px}" y1="${Y(v)}" y2="${Y(v)}" stroke="rgba(255,255,255,.06)" stroke-dasharray="1 5" stroke-linecap="round"/>`;
 let lines='',marker='';
 METRICS.forEach((m,mi)=>{
  const pts=[];days.forEach((k,i)=>{const r=dayRec(k);if(hasCI(r))pts.push([X(i),Y(r[m.k])])});
  if(!pts.length)return;
  lines+=`<path d="${smoothPath(pts)}" fill="none" stroke="${m.c}" stroke-width="${m.k==='mood'?2.6:1.6}" stroke-linecap="round" opacity="${m.k==='mood'?1:.75}"/>`;
  if(m.k==='mood'){const p=pts[pts.length-1];marker=`<circle cx="${p[0]}" cy="${p[1]}" r="9" fill="${m.c}" opacity=".25"/><circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#fff"/><path d="M${p[0]-6} ${p[1]-16}h12l-6 8z" fill="#f3e15b"/>`}
 });
 let xl='';days.forEach((k,i)=>{if(i%((n>14)?7:3)===0||i===n-1){const d=parseKey(k);xl+=`<text x="${X(i)}" y="${H+12}" fill="rgba(255,255,255,.35)" font-size="9.5" text-anchor="middle">${d.getDate()}</text>`}});
 return `<svg class="wave" viewBox="0 0 ${W} ${H+16}">${g}${lines}${marker}${xl}</svg>`;
}
function avgOf(k,ks){const v=ks.map(x=>dayRec(x)).filter(hasCI).map(r=>r[k]);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null}
function miniRuler(v){let t='';for(let i=0;i<=24;i++)t+=`<line x1="${4+i*5.5}" x2="${4+i*5.5}" y1="${i%6===0?2:6}" y2="14" stroke="rgba(255,255,255,${i%6===0?.8:.4})" stroke-width="1.2"/>`;const x=v?4+(v-1)/4*132:4;return `<svg viewBox="0 0 140 16" style="width:100%;margin-top:8px">${t}<line x1="${x}" x2="${x}" y1="0" y2="16" stroke="#f3e15b" stroke-width="2.4"/></svg>`}

function migrateDays(days){
 Object.keys(days||{}).forEach(k=>{const r=days[k];if(!r||r.plan)return;r.plan=[];
  if(r.step&&STEP_BY[r.step])r.plan.push({kind:'step',id:r.step,slot:slotOf(STEP_BY[r.step]),done:!!r.done});
  if(r.bonus&&STEP_BY[r.bonus])r.plan.push({kind:'step',id:r.bonus,slot:'e',done:!!r.bonusDone,bonus:true});
  r.swaps=r.swaps||0});
 return days;
}
function migrate(s){
 if(!s||typeof s!=='object')return null;
 const f=fresh();
 if(!s.v||s.v<2){
  s.days=migrateDays(s.days||{});
  if(s.backup){try{const b=JSON.parse(s.backup);b.days=migrateDays(b.days||{});s.backup=JSON.stringify(b)}catch(_){}}
  s.migratedFrom=1;s.v=2;
 }
 for(const k in f)if(s[k]===undefined)s[k]=f[k];
 if(!s.settings)s.settings=f.settings;
 return s;
}

function pickStep(c,cat,exclude=[],slot){
 const p=P();const s=scoreOf(c);let target=s<2.4?1:s<3.6?2:3;
 if(p.activity==='none'&&cat==='body'&&programDay()<8)target=Math.min(target,1);
 const tags=profileTags();const pain=hasPain();const knee=(p.pain||[]).some(x=>x==='knee'||x==='injury'||x==='weight');
 const budget=+(p.time||20);const rec=recentIds();
 let pool=STEPS.filter(x=>(!cat||x.cat===cat)&&!exclude.includes(x.id));
 if(pain||knee)pool=pool.filter(x=>!x.tags.includes('hi'));
 let fr=pool.filter(x=>!rec.has(x.id));if(fr.length>=3)pool=fr;
 if(!pool.length)pool=STEPS.filter(x=>!exclude.includes(x.id));
 const ws=pool.map(x=>{
  let w=x.d===target?6:x.d===target-1?2.4:x.d===target+1?(target===1?.25:.8):0;
  const sit=x.tags.filter(t=>!['hi','pain'].includes(t));
  if(sit.length)w*=sit.some(t=>tags.has(t))?2.6:.2;
  if(pain&&x.cat==='body')w*=x.tags.includes('pain')?2:.5;
  if(x.min>budget*1.5)w*=.25;
  if(slot){if(x.tod===slot)w*=1.6;else if(x.tod!=='a')w*=.35}
  if(c&&c.energy<=2&&x.cat==='body'&&x.d>1)w*=.3;
  return w});
 const sum=ws.reduce((a,b)=>a+b,0);
 if(sum<=0)return pool[Math.floor(Math.random()*pool.length)].id;
 let r=Math.random()*sum;for(let i=0;i<pool.length;i++){r-=ws[i];if(r<=0)return pool[i].id}
 return pool[pool.length-1].id;
}

 let n={10:3,20:3,40:4,60:5}[p.time]||3;if(sc<2.4)n=3;
 const goalCat={energy:'food',order:'work',job:'work',body:'body',people:'people',calm:'mind'}[p.goal]||'work';
 const cats=['body'];
 if(!cats.includes(goalCat))cats.push(goalCat);
 if((p.social==='rare'||p.social==='none')&&!cats.includes('people'))cats.push('people');
 if(!cats.includes('mind'))cats.push('mind');
 ['people','work','food','mind','body'].forEach(x=>{if(cats.length<n&&!cats.includes(x))cats.push(x)});
 const items=[];const ex=[];
 const prefSlot=cat=>{if(cat==='mind')return'e';if(cat==='body')return sc>=3&&['m','d','e'].includes(p.tod)?p.tod:'m';if(cat===goalCat&&['m','d','e'].includes(p.tod))return p.tod;return cat==='food'?'m':'d'};
 cats.slice(0,n).forEach(cat=>{const sl=prefSlot(cat);const id=pickStep(c,cat,ex,sl);ex.push(id);const s=STEP_BY[id];items.push({kind:'step',id,slot:s.tod==='a'?sl:s.tod,done:false})});
 const hi=nextHobbyStep();
 if(hi!=null&&hi>=0)items[items.length-1]={kind:'hobby',id:S.hobby.id,idx:hi,slot:p.tod==='e'?'e':'d',done:false};
 else if(S.hobby&&hi===-1&&(programDay()%2===0||+(p.time||0)>=40))items[items.length-1]={kind:'hobby',id:S.hobby.id,idx:3,slot:'e',done:false};

 const order={m:0,d:1,e:2};items.sort((a,b)=>order[a.slot]-order[b.slot]);
 return items;
}

function demoData(){
 let seed=11;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;const rr=Math.random;Math.random=rnd;
 const t=todayKey();const days={};
 const prof=S.profile||{situation:['job','move'],goal:'energy',sleep:'short',activity:'low',pain:['back'],social:'rare',time:'40',tod:'m',helped:['walk','sport'],interests:['hands','digital','sport'],budget:'0',company:'both',name:''};
 const keepP=S.profile,keepD=S.days,keepH=S.hobby,keepC=S.challenges;S.profile=prof;S.days=days;S.hobby=null;S.challenges={};
 const notes={14:'Тяжело встал, но вышел',12:'Плохо спал, много мыслей',10:'Позвонил брату, полегчало',7:'Первая пробежка за месяц',4:'Приготовил нормальный ужин',2:'Написал старому другу'};
 const goods=['Вышел на улицу','Позвонил другу','Разобрал стол','Сделал комплекс для спины','Приготовил ужин','Дочитал главу'];
 const tom=['Позвонить маме','Отправить резюме','Прогулка утром','Починить полку','Сходить в зал'];
 for(let i=14;i>=1;i--){const k=addDays(t,-i);if(i===9||i===5)continue;
  const base=1.7+(14-i)/13*2.1;
  const r={sleep:clamp(Math.round(base-.2+(rnd()-.5)*1.4),1,5),energy:clamp(Math.round(base+(rnd()-.5)*1.1),1,5),mood:clamp(Math.round(base+(rnd()-.4)*.8),1,5),note:notes[i]||''};
  r.plan=buildPlan(r).filter(x=>x.kind==='step');r.swaps=0;
  const pDone=.55+(14-i)/30;r.plan.forEach((it,j)=>{it.done=i===12?false:(j===0||rnd()<pDone)});
  if(rnd()<.55&&i!==12)r.eve={good:goods[Math.floor(rnd()*goods.length)],tomorrow:tom[Math.floor(rnd()*tom.length)],saved:true};
  days[k]=r}
 Math.random=rr;S.profile=keepP;S.days=keepD;S.hobby=keepH;S.challenges=keepC;
 return{days,start:addDays(t,-14),profile:keepP||prof,hobby:{id:'d1',start:addDays(t,-5),done:[true,true,false],practice:0},
  challenges:{ch_walk7:{start:addDays(t,-4),days:{[addDays(t,-4)]:true,[addDays(t,-3)]:true,[addDays(t,-1)]:true}}},
  sessions:[{type:'breath',id:'br46',min:2,at:0,day:addDays(t,-3)},{type:'workout',id:'wk_back',min:8,at:0,day:addDays(t,-2)},{type:'walk',id:2,min:20,at:0,day:addDays(t,-1)}]};
}

function drawIcon(sz){
 const cv=document.createElement('canvas');cv.width=cv.height=sz;const x=cv.getContext('2d');const s=sz/64;
 const g=x.createLinearGradient(0,0,sz,sz);g.addColorStop(0,'#ff5aa5');g.addColorStop(.52,'#a65ce0');g.addColorStop(1,'#ff7a3a');x.fillStyle=g;x.fillRect(0,0,sz,sz);
 const rg=x.createRadialGradient(sz*.3,sz*.25,0,sz*.3,sz*.25,sz*.7);rg.addColorStop(0,'rgba(255,255,255,.25)');rg.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=rg;x.fillRect(0,0,sz,sz);
 x.fillStyle='#fff';
 const rr=(X,Y,W,H,R)=>{X*=s;Y*=s;W*=s;H*=s;R*=s;x.beginPath();x.moveTo(X+R,Y);x.arcTo(X+W,Y,X+W,Y+H,R);x.arcTo(X+W,Y+H,X,Y+H,R);x.arcTo(X,Y+H,X,Y,R);x.arcTo(X,Y,X+W,Y,R);x.fill()};
 rr(13,43,38,7,3.5);rr(25,32,26,7,3.5);rr(37,21,14,7,3.5);x.beginPath();x.arc(44*s,12.5*s,4.2*s,0,7);x.fill();
 return cv.toDataURL('image/png');
}

/* ---------- хэш PIN (локально, с солью) ---------- */
function fnv(s){let h1=0x811c9dc5,h2=0x1b873593;for(let r=0;r<2000;r++){for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,16777619)>>>0;h2=Math.imul(h2^c,2246822507)>>>0}s=h1.toString(16)+h2.toString(16)}return s}
async function hashPin(pin,salt,alg){const s=salt+':'+pin+':opora';
 if(alg!=='fnv'&&window.crypto&&crypto.subtle){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return{alg:'sha256',h:[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}}catch(_){}}
 return{alg:'fnv',h:fnv(s)}}
function newSalt(){const a=new Uint8Array(12);try{crypto.getRandomValues(a)}catch(_){for(let i=0;i<12;i++)a[i]=Math.random()*256|0}return[...a].map(x=>x.toString(16).padStart(2,'0')).join('')}

   <label class="fld"><span class="fi">@</span><input id="regNick" maxlength="20" autocomplete="off" placeholder="Ник или имя" value="${esc(g.nick)}"></label>
   <div class="lbl2">Твой шар</div>
   <div class="avs">${AVS.map((c,i)=>`<button class="sph av ${i===g.av?'on':''}" style="${sphSt(c[0],.9,c[1])}" data-a="regAv" data-v="${i}" aria-label="Шар ${i+1}"></button>`).join('')}</div>
   <div class="fld tglrow"><span class="fi">${I_LOCK}</span><div class="tgt">PIN-код при входе<small>4 цифры · хранится только хэш</small></div><button class="tg ${g.pinOn?'on':''}" data-a="regPin" aria-label="PIN-код"></button></div>
   ${g.edit&&S.account&&S.account.pin&&g.pinOn?`<button class="rlink" data-a="regPinChange">Сменить PIN</button>`:''}
   <div class="regfoot"><p>Никаких серверов: профиль и записи живут только на этом телефоне.</p>
   <button class="pillj" data-a="regDone">${g.edit?'Сохранить':'Создать'}<span class="pcj">${I.arrowR}</span></button></div>
  </section>
  ${g.edit?'':`<div class="regnote"><b>Дальше</b> — 12 коротких вопросов, чтобы собрать план под тебя.</div>`}
 </div>`;
}
function finishReg(){
 const g=ui.reg;ui.reg=null;ui.pin=null;
 if(g&&g.edit){render();toast('Профиль сохранён');return}
 if(!S.profile){ui.ob=ui.ob||{a:{},edit:false};ui.ob.step='q';ui.ob.i=0;ui.ob.a=ui.ob.a||{};ui.ob.a.name=nick()}
 render();$('#view').scrollTop=0;
}

/* ---------- PIN: установка и экран входа ---------- */
function renderPin(mode){
 const p=ui.pin||(ui.pin0=ui.pin0||{v:''});const v=(ui.locked?ui.lockIn:p.v)||'';const av=avOf();
 const wait=ui.lockUntil&&Date.now()<ui.lockUntil;
 const title=mode==='lock'?(nick()?`С возвращением, ${esc(nick())}`:'С возвращением'):mode==='set1'?'Придумай PIN':'Повтори PIN';
 const sub=mode==='lock'?(wait?`Слишком много попыток. Подожди ${Math.ceil((ui.lockUntil-Date.now())/1000)} с`:(ui.lockErr?'Неверный PIN':'Введи PIN, чтобы открыть')):(p.err?'Не совпало. Ещё раз':'4 цифры. Хранится только хэш на этом телефоне');
 const keys=['1','2','3','4','5','6','7','8','9',mode==='lock'?'forgot':(p.mode==='set1'?'cancel':'back'),'0','del'];
 return `${ui.pin&&ui.pin.light?'<div class="regbg"><i class="sun"></i><i class="ball b1"></i><i class="ball b2"></i></div>':''}<div class="screen pinv ${ui.pin&&ui.pin.light?'lt':''}">
  <div class="pinhead"><span class="sph pav" style="${sphSt(av[0],.85,av[1])}"></span><h2>${title}</h2><p class="${(ui.lockErr||p.err)?'err':''}">${sub}</p></div>
  <div class="pdots ${(ui.lockErr||p.err)?'shake':''}">${[0,1,2,3].map(i=>`<i class="${i<v.length?'on':''}"></i>`).join('')}</div>
  <div class="pad">${keys.map(k=>k==='del'?`<button class="pk fn" data-a="pinKey" data-v="del" aria-label="Стереть">${I_DEL}</button>`:k==='forgot'?`<button class="pk fn tx" data-a="pinForgot">Забыл</button>`:k==='cancel'?`<button class="pk fn tx" data-a="pinCancel">Без PIN</button>`:k==='back'?`<button class="pk fn tx" data-a="pinBack">Назад</button>`:`<button class="pk" data-a="pinKey" data-v="${k}" ${wait?'disabled':''}>${k}</button>`).join('')}</div>
 </div>`;
}
async function pinSubmit(){
 if(ui.locked){const a=S.account.pin;const r=await hashPin(ui.lockIn,a.salt,a.alg);
  if(r.h===a.h){ui.locked=false;ui.lockIn='';ui.lockErr=false;ui.tries=0;render();return}
  ui.tries=(ui.tries||0)+1;ui.lockErr=true;ui.lockIn='';if(ui.tries>=5){ui.lockUntil=Date.now()+30000;ui.tries=0;const t=setInterval(()=>{if(!ui.locked||Date.now()>=ui.lockUntil){clearInterval(t)}render()},1000)}
  render();try{navigator.vibrate&&navigator.vibrate([30,40,30])}catch(_){}return}
 const p=ui.pin;
 if(p.mode==='set1'){p.first=p.v;p.v='';p.mode='set2';p.err=false;render();return}
 if(p.v!==p.first){p.mode='set1';p.v='';p.first='';p.err=true;render();try{navigator.vibrate&&navigator.vibrate([30,40,30])}catch(_){}return}
 const salt=newSalt();const r=await hashPin(p.v,salt);S.account.pin={salt,alg:r.alg,h:r.h};save();toast('PIN установлен');
 if(p.then==='reg')finishReg();else{ui.pin=null;render()}
}
Object.assign(A,{
 obStart(){ui.reg=newReg(false);render();$('#view').scrollTop=0},
 obEdit(){ui.ob={step:'q',i:0,a:Object.assign(JSON.parse(JSON.stringify(S.profile||{})),{name:nick()}),edit:true};render();$('#view').scrollTop=0},
 regAv(el){ui.reg.nick=($('#regNick')||{}).value||ui.reg.nick;ui.reg.av=+el.dataset.v;render()},
 regPin(){ui.reg.nick=($('#regNick')||{}).value||ui.reg.nick;ui.reg.pinOn=!ui.reg.pinOn;render()},
 regCancel(){ui.reg=null;render()},
 regPinChange(){A.regDone(null,true)},
 regDone(_,forceSet){const g=ui.reg;const n=$('#regNick');g.nick=(n?n.value:g.nick).trim().slice(0,20);
  const old=S.account||{};S.account={nick:g.nick,av:g.av,pin:g.pinOn?old.pin||null:null,created:old.created||Date.now()};
  if(S.profile&&g.nick)S.profile.name=g.nick;save();
  if(g.pinOn&&(!S.account.pin||forceSet)){ui.pin={mode:'set1',v:'',then:'reg',light:true};render();return}
  finishReg()},
 pinKey(el){const k=el.dataset.v;
  if(ui.locked){if(ui.lockUntil&&Date.now()<ui.lockUntil)return;ui.lockErr=false;ui.lockIn=ui.lockIn||'';if(k==='del')ui.lockIn=ui.lockIn.slice(0,-1);else if(ui.lockIn.length<4)ui.lockIn+=k;render();if(ui.lockIn.length===4)setTimeout(pinSubmit,120);return}
  const p=ui.pin;p.err=false;if(k==='del')p.v=p.v.slice(0,-1);else if(p.v.length<4)p.v+=k;render();if(p.v.length===4)setTimeout(pinSubmit,120)},
 pinBack(){ui.pin.mode='set1';ui.pin.v='';ui.pin.first='';render()},
 pinCancel(){ui.pin=null;if(ui.reg){ui.reg.pinOn=false;if(S.account)S.account.pin=null;save()}render()},
 pinForgot(){confirmSheet('Забыл PIN?','Сервера нет, поэтому восстановить PIN нельзя — он хранится только как хэш на этом телефоне. Можно стереть все данные и начать заново.','Стереть и начать','doReset',true)},
 regEdit(){ui.reg=newReg(true);render();$('#view').scrollTop=0},
 ciSel(el){const n=$('#noteIn');if(n)ui.ci.note=n.value;ui.ci.step=+el.dataset.v;render()},
 lv(el){const s=ui.ci.step;if(s>2)return;const m=METRICS[s];ui.ci[m.k]=+el.dataset.v;ui.ci.set=ui.ci.set||{};ui.ci.set[m.k]=1;render();try{navigator.vibrate&&navigator.vibrate(8)}catch(_){}
  clearTimeout(ui.ciT);ui.ciT=setTimeout(()=>{if(ui.ci&&ui.ci.step===s){ui.ci.step++;render()}},420)},
 ciNext(){clearTimeout(ui.ciT);const s=ui.ci.step;if(s<3){ui.ci.set=ui.ci.set||{};ui.ci.set[METRICS[s].k]=1}ui.ci.step=Math.min(3,s+1);render()},
 wordOk(){const r=dayRec(todayKey());r.word=wordIdx();save();ui.wOpen=false;render();toast('Слово дня принято')},
 wordNext(){ui.wOff=(ui.wOff||0)+1;ui.wOpen=true;render()},
 wordOpen(){ui.wOpen=!ui.wOpen;render()}
});
document.addEventListener('input',e=>{if(e.target.id==='regNick'&&ui.reg)ui.reg.nick=e.target.value});
document.addEventListener('keydown',e=>{if(e.target.id==='regNick'&&e.key==='Enter'){e.preventDefault();e.target.blur()}
 if((ui.locked||ui.pin)&&/^[0-9]$/.test(e.key)){A.pinKey({dataset:{v:e.key}})}if((ui.locked||ui.pin)&&e.key==='Backspace'){A.pinKey({dataset:{v:'del'}})}});

/* ---------- сегодня: приветствие, пузыри дат, сферы чек-ина ---------- */
function weekStrip(){
 const t=new Date();let h='<div class="dbs">';
 for(let i=-3;i<=1;i++){const d=new Date(t);d.setDate(t.getDate()+i);const k=keyOf(d);const r=dayRec(k);const pl=r&&r.plan?r.plan:[];const dn=pl.filter(x=>x.done).length;
  const cls=['db'];if(i===0)cls.push('on');if(i>0)cls.push('fut');if(r&&dayDone(r))cls.push('done');
  h+=`<div class="${cls.join(' ')}"><small>${i===0?'Сегодня':WDS[d.getDay()]}</small><b>${d.getDate()}</b><small>${i>0?'завтра':pl.length?dn+'/'+pl.length:'—'}</small></div>`}
 return h+'</div>';
}
function hello(){const n=nick();return `<div class="hi2">Привет,<br><b>${n?esc(n):'друг'}!</b></div>`}
function renderToday(){
 const k=todayKey();const r=dayRec(k);
 let h=`<div class="screen">${topBar()}${hello()}${weekStrip()}`;
 if(!hasCI(r)||ui.editing){
  if(!ui.ci)ui.ci={step:0,sleep:r&&r.sleep||3,energy:r&&r.energy||3,mood:r&&r.mood||3,note:r&&r.note||'',set:r&&r.sleep?{sleep:1,energy:1,mood:1}:{}};
  const last=lastActiveBefore(k);
  if(!ui.editing&&last&&diffDays(last,k)>=2&&ui.ci.step===0)h+=`<div class="banner card g-dark"><b>Вернулся — это уже шаг.</b><div class="sub">Пропуски — часть пути, а не провал. Продолжаем с сегодняшнего дня.</div></div>`;
  return h+renderCheckin()+'</div>';
 }
 if(!r.plan||!r.plan.length){r.plan=buildPlan(r);save()}
 return h+renderDayHero(r)+renderPlan(r)+renderWord(r)+renderNewPrompt()+renderEvening(r)+renderProgramCard()+'</div>';
}
function renderCheckin(){
 const c=ui.ci,s=c.step;c.set=c.set||{};
 const row=`<div class="sphrow">${METRICS.map((m,i)=>`<button class="sphb ${i===s?'on':''} ${c.set[m.k]?'set':''}" data-a="ciSel" data-v="${i}"><span class="sph" style="${sphSt(m.c,c.set[m.k]?.35+c[m.k]*.13:.25,m.light)}"><b>${c.set[m.k]?c[m.k]:''}</b></span><span class="sl">${m.name}</span></button>`).join('')}
  <button class="sphb ${s===3?'on':''} ${c.note?'set':''}" data-a="ciSel" data-v="3"><span class="sph" style="${sphSt('#7fd3c0',c.note?.9:.3,'#e8f6c8')}"><b>${c.note?'✓':''}</b></span><span class="sl">Мысль</span></button></div>`;
 const head=`<div class="eyebrow ci2e">Как ты сегодня? · день ${clamp(programDay(),1,999)} · ${s<3?s+1:4} из 4</div>`;
 if(s<3){
  const m=METRICS[s];const v=c[m.k];
  return `${head}${row}<section class="card glass2 ci2" style="--c:${m.c}">
   <div class="q">${m.q}</div><div class="qs">${s===0?'Нажми на шар — оценка от 1 до 5':m.qs}</div>
   <div class="ciword">${c.set[m.k]?m.words[v-1]:'&nbsp;'}</div>
   <div class="lvo">${[1,2,3,4,5].map(i=>`<button data-a="lv" data-v="${i}" class="sph lvb ${c.set[m.k]&&i===v?'on':''}" style="${sphSt(m.c,.2+i*.16,m.light)};--s:${.72+i*.07}" aria-label="${m.words[i-1]}"><b>${i}</b></button>`).join('')}</div>
   <div class="lvw"><span>${m.words[0]}</span><span>${m.words[4]}</span></div>
   <div class="cifoot">${s>0?`<button class="back" data-a="ciBack" aria-label="Назад">${I.arrowL}</button>`:(ui.editing?`<button class="back" data-a="ciCancel" aria-label="Отмена">${I.arrowL}</button>`:'<span style="width:44px"></span>')}
   <button class="pill" data-a="ciNext">${c.set[m.k]?'Дальше':'Пропустить'}<span class="pc">${I.arrowR}</span></button></div></section>`;
 }
 return `${head}${row}<section class="card glass2 ci2" style="--c:#7fd3c0">
  <div class="q">Одна мысль о себе</div><div class="qs">Необязательно. Видишь только ты.</div>
  <input class="note" id="noteIn" maxlength="140" placeholder="Например: вчера впервые вышел на пробежку" value="${esc(c.note)}">
  <div class="cifoot"><button class="back" data-a="ciBack" aria-label="Назад">${I.arrowL}</button>
  <button class="pill light" data-a="ciFinish">${ui.editing?'Сохранить':'Собрать план дня'}<span class="pc">${I.arrowR}</span></button></div></section>`;
}
/* ---------- цель дня: диск + N/M ---------- */
function discSVG(f){
 const R=54,cx=60,cy=60;let sec='';
 if(f>=.999)sec=`<circle cx="60" cy="60" r="${R}" fill="url(#gdF)"/>`;
 else if(f>0){const a1=Math.PI*2*f;const x=cx+R*Math.cos(a1),y=cy+R*Math.sin(a1);sec=`<path d="M60 60 L${cx+R} 60 A${R} ${R} 0 ${f>.5?1:0} 1 ${x.toFixed(2)} ${y.toFixed(2)}Z" fill="url(#gdF)"/><rect x="${(x-3).toFixed(1)}" y="${(y-3).toFixed(1)}" width="6" height="6" fill="#fff"/>`}
 return `<svg class="gdisc" viewBox="0 0 120 120"><defs><linearGradient id="gdB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#55555e"/><stop offset="1" stop-color="#1b1b21"/></linearGradient><linearGradient id="gdF" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#fff"/><stop offset=".6" stop-color="#d9d6e0"/><stop offset="1" stop-color="#9a97a6"/></linearGradient></defs>
 <circle cx="60" cy="60" r="${R}" fill="url(#gdB)"/>${sec}<rect x="111" y="57" width="6" height="6" fill="#fff"/></svg>`;
}
function renderDayHero(r){
 const dn=doneCount(r),tot=r.plan.length,all=dn===tot&&tot>0;const x=xp(),st=stageOf(x);
 const pct=st.to?Math.round((x-st.from)/(st.to-st.from)*100):100;
 return `<section class="card goal ${all?'all':''}" id="hero">
  <div class="between"><div class="gt">Цель дня</div><button class="hmet" data-a="editCI">${METRICS.map(m=>`<span><i style="background:${m.c}"></i>${r[m.k]}</span>`).join('')}</button></div>
  <div class="gviz">${discSVG(tot?dn/tot:0)}<span class="gline"></span><div class="gring"><i class="glow"></i><div class="gnum">${dn}<em>/</em>${tot}</div></div></div>
  <p class="gsub">${all?'День собран полностью. Можно выдохнуть.':dn?`День уже засчитан. Ещё ${tot-dn} — и он собран полностью.`:'Отметь хотя бы один шаг — и день засчитан.'}</p>
  <div class="gst"><div><span class="lbl">Этап</span><b>${st.name}</b></div><div class="bar"><i style="width:${pct}%"></i></div><span class="lbl">${st.next?`${x}/${st.to}`:`${x}`}</span></div>
 </section>`;
}
/* ---------- слово дня ---------- */
function wordIdx(){return(Math.floor(new Date(todayKey()+'T12:00').getTime()/864e5)+(ui.wOff||0))%WORDS.length}
function renderWord(r){
 const i=wordIdx();const w=WORDS[i];const seen=r.word!=null&&!ui.wOpen;
 if(seen){const s=WORDS[r.word]||w;return `<button class="card wchip" data-a="wordOpen"><span class="lbl">Слово дня</span><b>${s[0]}</b><span class="chev">${I.chev}</span></button>`}
 return `<section class="card wordc"><div class="wbg"></div>
  <div class="between"><div class="row" style="gap:8px"><span class="wtag">слово дня</span><span class="lbl">${i+1} из ${WORDS.length}</span></div><button class="iconbtn sm" data-a="wordNext" aria-label="Другое слово">${I_REDO}</button></div>
  <div class="wbig">${w[0]}</div><div class="wdef">${w[2]}</div>
  <div class="wline"></div><div class="lbl">В деле</div><p class="wuse">${w[3]}</p>
  <div class="wfoot"><button class="pill cream" data-a="wordOk">Принял<span class="pc">${I.arrowR}</span></button></div></section>`;
}
/* ---------- splash: шар собирается, имя проявляется ---------- */
function splash(){
 const sp=$('#splash');if(!sp)return;const fast=!!S.seenSplash;
 const t0=fast?.25:1.0,dt=fast?.035:.085;
 sp.className=fast?'fast':'slow';
 sp.innerHTML=`<div class="spfx"><i class="bl b1"></i><i class="bl b2"></i><i class="bl b3"></i></div>
  <div class="sporb"><div class="sphl"></div><div class="splogo">${logoSVG(84,{anim:true,white:true})}</div></div>
  <div class="spname">${[...APP_NAME.toUpperCase()].map((ch,i)=>`<span style="animation-delay:${(t0+i*dt).toFixed(2)}s">${ch}</span>`).join('')}</div>
  <div class="sptag">${APP_TAG}</div>`;
 let gone=false;const hide=()=>{if(gone)return;gone=true;sp.classList.add('out');setTimeout(()=>sp.remove(),600)};
 sp.addEventListener('click',hide);setTimeout(hide,fast?1000:2500);
 if(!fast){S.seenSplash=true;save()}
}
/* ---------- блокировка при возврате ---------- */
let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{if(document.hidden){hiddenAt=Date.now()}else if(S.account&&S.account.pin&&hiddenAt&&Date.now()-hiddenAt>120000){ui.locked=true;ui.lockIn='';render()}});
const _dr=A.doReset;A.doReset=function(){ui.locked=false;ui.lockIn='';ui.pin=null;ui.reg=null;ui.ob=null;_dr()};
if(S.account&&S.account.pin)ui.locked=true;
setupPWA();render();splash();scheduleReminder();


</script>
